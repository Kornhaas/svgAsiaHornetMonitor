[project]
name = "hornet-monitor"
version = "0.1.0"
description = "Raspberry Pi camera monitor for collecting Vespa velutina image events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4.0",
    "opencv-python>=4.8,<5.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.0,<8.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
hornet-monitor = "hornet_monitor.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hornet_monitor --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=40"

[tool.coverage.run]
branch = true
source = ["hornet_monitor"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
