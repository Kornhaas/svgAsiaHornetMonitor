camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 30
  mjpeg: true
  reconnect_seconds: 5
  reconnect_max_seconds: 120

motion:
  # Coordinates are pixels in the configured camera resolution.
  roi:
    x: 160
    y: 90
    width: 960
    height: 540
  trigger_roi:
    x: 280
    y: 170
    width: 720
    height: 380
  min_area: 900
  threshold: 25
  blur_size: 21
  cooldown_seconds: 10

events:
  directory: data/events
  # Save only the motion ROI for a focused, background-free training dataset.
  crop_to_roi: true
  burst_frames: 5
  burst_interval_seconds: 0.25

activity:
  file: data/activity.jsonl

annotations:
  file: data/annotations.jsonl
  predictions_file: data/predictions.jsonl

training:
  # A future training worker may run only inside this overnight window.
  start_hour: 21
  stop_hour: 6
  minimum_annotations: 50
  datasets_directory: data/datasets
  models_directory: data/models
  model_name: yolo11n.pt
  epochs: 30
  image_size: 320
  batch: 1

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  confidence_threshold: 0.8
  cooldown_seconds: 600

storage:
  directory: data
  backup_directory: data/backups
  minimum_free_gb: 10
  reviewed_retention_days: 30
  unreviewed_retention_days: 7
  cleanup_interval_seconds: 3600

background:
  image_file: data/background.jpg
  metadata_file: data/background.json
  proposal_minimum_area: 300

night_mode:
  enabled: true
  dark_threshold: 45
  bright_threshold: 65
  dark_seconds: 1200

web:
  host: 0.0.0.0
  port: 8000
  debug: false
  auth:
    enabled: false

updates:
  enabled: false
  repository: .
  uv_binary: uv
  service: hornet-monitor.service
