<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Asia Hornet Monitor{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom border-secondary-subtle" aria-label="Primary navigation">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">🐝 Asia Hornet Monitor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div id="navigation" class="collapse navbar-collapse"><ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {% if active_page == 'monitor' %}active{% endif %}" {% if active_page == 'monitor' %}aria-current="page"{% endif %} href="{{ url_for('index') }}">Live monitor</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'gallery' %}active{% endif %}" {% if active_page == 'gallery' %}aria-current="page"{% endif %} href="{{ url_for('gallery_page') }}">Image gallery</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'roi' %}active{% endif %}" {% if active_page == 'roi' %}aria-current="page"{% endif %} href="{{ url_for('roi_settings') }}">ROI settings</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'training' %}active{% endif %}" {% if active_page == 'training' %}aria-current="page"{% endif %} href="{{ url_for('training_page') }}">Model &amp; training</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'system' %}active{% endif %}" {% if active_page == 'system' %}aria-current="page"{% endif %} href="{{ url_for('system_page') }}">System status</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'camera' %}active{% endif %}" {% if active_page == 'camera' %}aria-current="page"{% endif %} href="{{ url_for('camera_settings') }}">Camera settings</a></li>
        </ul></div>
      </div>
    </nav>
    <main class="container py-4">{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
