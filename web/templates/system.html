<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>System status</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="{{ url_for('index') }}">← Live monitor</a><h1 class="h2 mt-3">System status</h1><div id="status" class="card card-body">Loading…</div><button id="background" class="btn btn-warning mt-3">Update background image</button><section class="card card-body mt-3"><h2 class="h5">Telegram notifications</h2><form id="telegram"><label><input id="enabled" type="checkbox"> Enable Telegram</label><input id="token" class="form-control mt-2" placeholder="Bot token"><input id="chat" class="form-control mt-2" placeholder="Chat ID"><label>Confidence threshold <input id="threshold" class="form-control" value="0.8" type="number" min="0.1" max="1" step="0.05"></label><label>Cooldown seconds <input id="cooldown" class="form-control" value="600" type="number" min="1"></label><button class="btn btn-warning mt-2">Save Telegram settings</button><span id="telegram-result"></span></form></section></main><script>async function load(){let s=await(await fetch('/api/system-status')).json(),d=s.device,b=s.background,n=d.night_mode;document.querySelector('#status').innerHTML=`<p><strong>Night mode:</strong> ${n.active?'active — motion paused':'daylight monitoring'} (brightness: ${n.brightness??'?'}/255)</p><p><strong>Background:</strong> ${b.available?'available':'not captured'} ${b.updated_at||''}</p><p><strong>Disk:</strong> ${d.disk_free_gb??'?'} GB free of ${d.disk_total_gb??'?'} GB</p><p><strong>CPU:</strong> ${d.cpu_load_1m??'unavailable'} · <strong>Memory:</strong> ${d.memory_used_percent??'unavailable'}%</p><p><strong>Code update:</strong> ${s.update.state}</p>`}document.querySelector('#background').onclick=async()=>{let r=await fetch('/api/background',{method:'POST'});alert(r.ok?'Background updated.':(await r.json()).error);load()};document.querySelector('#telegram').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/telegram',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,bot_token:token.value,chat_id:chat.value,confidence_threshold:+threshold.value,cooldown_seconds:+cooldown.value})});telegram-result.textContent=(await r.json()).message||'Could not save settings.';if(r.ok)setTimeout(()=>location.href='/',8000)};load()</script></body></html>
