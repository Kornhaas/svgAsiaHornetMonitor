<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>System status</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="{{ url_for('index') }}">← Live monitor</a><h1 class="h2 mt-3">System status</h1><div id="status" class="card card-body">Loading…</div><button id="background" class="btn btn-warning mt-3">Update background image</button><p class="small mt-2">Only use this while no animal is visible in the ROI.</p></main><script>async function load(){let s=await(await fetch('/api/system-status')).json(),d=s.device,b=s.background,n=d.night_mode;document.querySelector('#status').innerHTML=`<p><strong>Night mode:</strong> ${n.active?'active — motion capture paused':'daylight monitoring'} (brightness: ${n.brightness??'?'}/255)</p><p><strong>Background:</strong> ${b.available?'available':'not captured'} ${b.updated_at||''}</p><p><strong>Disk:</strong> ${d.disk_free_gb??'?'} GB free of ${d.disk_total_gb??'?'} GB</p><p><strong>CPU load (1 min):</strong> ${d.cpu_load_1m??'unavailable'}</p><p><strong>Memory used:</strong> ${d.memory_used_percent??'unavailable'}%</p><p><strong>Code update:</strong> ${s.update.state}</p>`}document.querySelector('#background').onclick=async()=>{let r=await fetch('/api/background',{method:'POST'});alert(r.ok?'Background updated.':(await r.json()).error);load()};load()</script></body></html>
