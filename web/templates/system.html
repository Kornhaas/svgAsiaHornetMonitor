{% extends "base.html" %}
{% block title %}System status · Asia Hornet Monitor{% endblock %}
{% block content %}
<h1 class="h2">System status</h1><div id="status" class="card card-body">Loading…</div><button id="background" class="btn btn-warning mt-3">Update background image</button><button id="backup" class="btn btn-outline-info mt-3">Create backup</button><span id="backup-result" class="ms-2" aria-live="polite"></span><section class="card card-body mt-3"><h2 class="h5">Telegram notifications</h2><form id="telegram"><label><input id="enabled" type="checkbox"> Enable Telegram</label><input id="token" class="form-control mt-2" placeholder="Bot token"><input id="chat" class="form-control mt-2" placeholder="Chat ID"><label>Confidence threshold <input id="threshold" class="form-control" value="0.8" type="number" min="0.1" max="1" step="0.05"></label><label>Cooldown seconds <input id="cooldown" class="form-control" value="600" type="number" min="1"></label><button class="btn btn-warning mt-2">Save Telegram settings</button><span id="telegram-result"></span></form></section>
{% endblock %}
{% block scripts %}<script>async function load(){const s=await(await fetch('/api/system-status')).json(),d=s.device,b=s.background,n=d.night_mode,storage=d.storage||{};document.querySelector('#status').innerHTML=`<p><strong>Night mode:</strong> ${n.active?'active — motion paused':n.preview_disabled?'night mode pending — preview disabled':'daylight monitoring'} (brightness: ${n.brightness??'?'}/255)</p><p><strong>Background:</strong> ${b.available?'available':'not captured'} ${b.updated_at||''}</p><p class="${storage.warning?'text-warning fw-bold':''}"><strong>Storage:</strong> ${storage.free_gb??d.disk_free_gb??'?'} GB free${storage.warning?' — cleanup and backup recommended.':''}</p><p><strong>CPU:</strong> ${d.cpu_load_1m??'unavailable'} · <strong>Memory:</strong> ${d.memory_used_percent??'unavailable'}%</p><p><strong>Code update:</strong> ${s.update.state}</p>`}document.querySelector('#background').onclick=async()=>{const r=await fetch('/api/background',{method:'POST'});alert(r.ok?'Background updated.':(await r.json()).error);load()};document.querySelector('#backup').onclick=async()=>{const r=await fetch('/api/backup',{method:'POST'}),v=await r.json();document.querySelector('#backup-result').textContent=v.path||v.error};document.querySelector('#telegram').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/telegram',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,bot_token:token.value,chat_id:chat.value,confidence_threshold:+threshold.value,cooldown_seconds:+cooldown.value})});document.querySelector('#telegram-result').textContent=(await r.json()).message||'Could not save settings.';if(r.ok)setTimeout(()=>location.href='/',8000)};load()</script>{% endblock %}
