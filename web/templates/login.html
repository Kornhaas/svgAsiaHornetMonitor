<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hornet Monitor login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="login-page">
    <main class="container py-5">
      <div class="card shadow-lg login-card">
        <div class="card-body p-4">
          <h1 class="h3">🐝 Asia Hornet Monitor</h1>
          <p class="text-body-secondary">Sign in to manage your local monitor.</p>
          <form method="post" action="{{ url_for('login') }}" autocomplete="on">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input id="username" name="username" class="form-control" type="text"
                     autocomplete="username" autocapitalize="none" autocorrect="off"
                     spellcheck="false" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input id="password" name="password" class="form-control" type="password"
                     autocomplete="current-password" required>
            </div>
            <button class="btn btn-warning w-100" type="submit">Sign in</button>
            {% if error %}
            <div class="alert alert-danger mt-3 mb-0" role="alert">{{ error }}</div>
            {% endif %}
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
