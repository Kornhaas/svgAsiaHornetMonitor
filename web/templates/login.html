<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hornet Monitor login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><main class="container py-5"><div class="card shadow-lg login-card"><div class="card-body p-4"><h1 class="h3">🐝 Asia Hornet Monitor</h1><p class="text-body-secondary">Sign in to manage your local monitor.</p><form method="post"><label class="form-label w-100">Username <input name="username" class="form-control" required autofocus></label><label class="form-label w-100">Password <input name="password" class="form-control" type="password" required></label><button class="btn btn-warning w-100">Sign in</button>{% if error %}<div class="alert alert-danger mt-3 mb-0">{{ error }}</div>{% endif %}</form></div></div></main></body></html>
