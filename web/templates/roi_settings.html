<!doctype html>
<html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ROI settings · Hornet Monitor</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><nav class="navbar navbar-expand-lg border-bottom border-secondary-subtle"><div class="container"><a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">🐝 Asia Hornet Monitor</a><div><a class="btn btn-outline-light btn-sm" href="{{ url_for('index') }}">Live monitor</a></div></div></nav><main class="container py-4"><h1 class="h2 mb-1">Region of interest</h1><p class="text-body-secondary">Set the yellow area used for motion detection and newly saved event images.</p><div class="alert alert-warning">Changing the ROI resets motion detection briefly. It is saved only on this Raspberry Pi.</div><div class="card shadow-sm mb-3"><div class="card-body p-2"><div class="stream-container rounded overflow-hidden"><img id="stream" class="stream" src="{{ url_for('stream') }}" alt="Live camera stream"><div id="roi" class="roi" aria-label="Motion detection area"></div></div></div></div><form id="roi-form" class="card card-body shadow-sm"><div class="d-flex flex-wrap align-items-end gap-3"><label class="form-label mb-0">X <input id="roi-x" name="x" class="form-control" type="number" min="0" required></label><label class="form-label mb-0">Y <input id="roi-y" name="y" class="form-control" type="number" min="0" required></label><label class="form-label mb-0">Width <input id="roi-width" name="width" class="form-control" type="number" min="1" required></label><label class="form-label mb-0">Height <input id="roi-height" name="height" class="form-control" type="number" min="1" required></label><button class="btn btn-warning">Save ROI</button><span id="roi-message" class="text-body-secondary"></span></div><p class="small text-body-secondary mb-0 mt-3">Drag a new rectangle in the live image, or enter pixel values.</p></form></main><script src="{{ url_for('static', filename='roi.js') }}"></script></body></html>
