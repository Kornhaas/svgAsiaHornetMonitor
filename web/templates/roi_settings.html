<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ROI settings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container py-4"><a href="{{ url_for('index') }}">← Live monitor</a><h1>Image and trigger regions</h1><p>Outer ROI is saved in event images. Inner trigger ROI starts an event only after the animal has moved further into the image.</p><img id="stream" class="stream" src="{{ url_for('stream') }}"><form id="outer" class="card card-body mt-3"><h2 class="h5">Outer image ROI</h2><input name="x" placeholder="X"><input name="y" placeholder="Y"><input name="width" placeholder="Width"><input name="height" placeholder="Height"><button>Save image ROI</button></form><form id="trigger" class="card card-body mt-3"><h2 class="h5">Inner trigger ROI</h2><input name="x" placeholder="X"><input name="y" placeholder="Y"><input name="width" placeholder="Width"><input name="height" placeholder="Height"><button>Save trigger ROI</button></form><p id="message"></p></main><script src="{{ url_for('static', filename='roi.js') }}"></script></body></html>
