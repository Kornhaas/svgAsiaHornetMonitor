<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Asia Hornet Monitor</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><h1>Asia Hornet Monitor</h1><div class="status"><span id="indicator"></span><span id="message">Connecting…</span></div><div class="stream-container"><img id="stream" class="stream" src="{{ url_for('stream') }}" alt="Live camera stream"><div id="roi" class="roi" aria-label="Motion detection area"></div></div><form id="roi-form" class="roi-form"><strong>Region of interest</strong><label>X <input id="roi-x" name="x" type="number" min="0" required></label><label>Y <input id="roi-y" name="y" type="number" min="0" required></label><label>Width <input id="roi-width" name="width" type="number" min="1" required></label><label>Height <input id="roi-height" name="height" type="number" min="1" required></label><button>Save ROI</button><span id="roi-message"></span></form><p id="details"></p><section class="activity"><h2>Activity log</h2><ol id="activity-list"><li>Loading activity…</li></ol></section><section class="activity"><h2>System update</h2><p id="update-message">Check whether an update is available.</p><button id="check-update">Check for update</button> <button id="install-update">Install update</button></section></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
