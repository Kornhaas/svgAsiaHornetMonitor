<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image gallery</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav class="navbar border-bottom"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}">🐝 Asia Hornet Monitor</a><a href="{{ url_for('index') }}">Live monitor</a></div></nav><main class="container py-4"><h1 class="h2">Image gallery</h1><p id="gallery-message"></p><div class="gallery-layout"><section id="event-list" class="event-list"></section><section class="card"><div class="card-body"><div id="annotation-canvas" class="annotation-canvas"><img id="annotation-image"><div id="annotation-box" class="annotation-box"></div></div><form id="annotation-form" class="mt-3"><label>Class <select id="annotation-label" class="form-select"><option value="vespa_velutina">Asian hornet</option><option value="vespa_crabro">European hornet</option><option value="wasp">Wasp</option><option value="bee">Bee</option><option value="other">Other</option><option value="empty">Empty</option><option value="uncertain">Uncertain</option></select></label><button id="add-box" type="button" class="btn btn-outline-light">Add box</button><button id="suggest-boxes" type="button" class="btn btn-outline-info">Suggest objects</button><button class="btn btn-warning">Save all</button><button id="delete-event" type="button" class="btn btn-outline-danger">Delete event</button><ul id="annotation-list" class="list-group mt-3"></ul><span id="annotation-message"></span></form><p class="small">Draw and add every animal, then save all boxes together. Suggestions require review.</p></div></section></div></main><script src="{{ url_for('static', filename='gallery.js') }}"></script></body></html>
