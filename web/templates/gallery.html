<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image gallery · Hornet Monitor</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav class="navbar border-bottom border-secondary-subtle"><div class="container"><a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">🐝 Asia Hornet Monitor</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('index') }}">Live monitor</a></div></nav><main class="container py-4"><div class="d-flex flex-wrap justify-content-between align-items-end gap-2"><div><h1 class="h2 mb-1">Image gallery</h1><p id="gallery-message" class="text-body-secondary mb-0">Loading events…</p></div><div class="form-check form-switch"><input id="show-reviewed" class="form-check-input" type="checkbox"><label class="form-check-label" for="show-reviewed">Show reviewed</label></div></div><div class="gallery-layout mt-3"><section id="event-list" class="event-list"></section><section><div class="card shadow-sm"><div class="card-body"><div id="annotation-canvas" class="annotation-canvas rounded overflow-hidden"><img id="annotation-image" alt="Selected event image"><div id="annotation-box" class="annotation-box"></div></div><form id="annotation-form" class="mt-3"><div class="d-flex flex-wrap align-items-end gap-3"><label class="form-label mb-0">Class <select id="annotation-label" class="form-select"><option value="vespa_velutina">Asian hornet</option><option value="vespa_crabro">European hornet</option><option value="wasp">Wasp</option><option value="bee">Bee</option><option value="other">Other</option><option value="empty">Empty</option><option value="uncertain">Uncertain</option></select></label><button class="btn btn-warning">Save annotation</button><button id="delete-event" type="button" class="btn btn-outline-danger">Delete event</button><span id="annotation-message" class="text-body-secondary"></span></div></form><p class="text-body-secondary small mt-3 mb-0">After saving, the next unreviewed event opens automatically. Deleting removes the whole event burst after confirmation.</p></div></div></section></div></main><script src="{{ url_for('static', filename='gallery.js') }}"></script></body></html>
