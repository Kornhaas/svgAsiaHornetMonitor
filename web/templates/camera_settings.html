{% extends "base.html" %}
{% block title %}Camera settings · Asia Hornet Monitor{% endblock %}
{% block content %}
<h1 class="h2">Camera settings</h1><p>Saving restarts the monitor. The browser reconnects automatically.</p><form id="camera" class="card card-body"><label>Camera device <select id="device" class="form-select"></select></label><label>Width <input id="width" class="form-control" type="number" value="1280"></label><label>Height <input id="height" class="form-control" type="number" value="720"></label><label>FPS <input id="fps" class="form-control" type="number" value="30"></label><button class="btn btn-warning mt-3">Save and restart</button><span id="message"></span></form>
{% endblock %}
{% block scripts %}<script>async function init(){const cameras=await(await fetch('/api/cameras')).json(),device=document.querySelector('#device');device.innerHTML=(cameras.length?cameras:['/dev/video0']).map(x=>`<option>${x}</option>`).join('')}document.querySelector('#camera').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/camera',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:document.querySelector('#device').value,width:+document.querySelector('#width').value,height:+document.querySelector('#height').value,fps:+document.querySelector('#fps').value,mjpeg:true})});document.querySelector('#message').textContent=(await r.json()).message||'Could not save settings.';if(r.ok)setTimeout(()=>location.href='/',8000)};init()</script>{% endblock %}
