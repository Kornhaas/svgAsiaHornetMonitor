<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Camera settings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="{{ url_for('index') }}">← Live monitor</a><h1 class="h2 mt-3">Camera settings</h1><p>Saving restarts the monitor. The browser reconnects automatically.</p><form id="camera" class="card card-body"><label>Camera device <select id="device" class="form-select"></select></label><label>Width <input id="width" class="form-control" type="number" value="1280"></label><label>Height <input id="height" class="form-control" type="number" value="720"></label><label>FPS <input id="fps" class="form-control" type="number" value="30"></label><button class="btn btn-warning mt-3">Save and restart</button><span id="message"></span></form></main><script>async function init(){let cameras=await(await fetch('/api/cameras')).json(),device=document.querySelector('#device');device.innerHTML=(cameras.length?cameras:['/dev/video0']).map(x=>`<option>${x}</option>`).join('')}document.querySelector('#camera').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/camera',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:document.querySelector('#device').value,width:+document.querySelector('#width').value,height:+document.querySelector('#height').value,fps:+document.querySelector('#fps').value,mjpeg:true})});document.querySelector('#message').textContent=(await r.json()).message||'Could not save settings.';if(r.ok)setTimeout(()=>location.href='/',8000)};init()</script></body></html>
